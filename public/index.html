<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Historical Correspondent — RTTP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f4f0;display:flex;justify-content:center;padding:24px 12px;min-height:100vh;}
.app{font-family:'Courier Prime',monospace;background:#fff;border:0.5px solid #ddd;border-radius:12px;overflow:hidden;width:100%;max-width:680px;}
.masthead{background:#f9f8f5;border-bottom:1px solid #ccc;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.masthead-title{font-family:'IM Fell English',serif;font-size:18px;font-weight:400;color:#111;letter-spacing:.02em;white-space:nowrap;}
.section-bar{display:flex;gap:4px;}
.sec-btn{padding:4px 14px;font-family:'Special Elite',cursive;font-size:11px;background:transparent;border:0.5px solid #bbb;border-radius:999px;color:#666;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;}
.sec-btn.active{background:#111;color:#fff;border-color:#111;}
.sec-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.scenario-bar{display:flex;border-bottom:0.5px solid #ddd;}
.sc-btn{flex:1;padding:6px 4px;font-family:'Special Elite',cursive;font-size:11px;background:transparent;border:none;border-right:0.5px solid #ddd;color:#888;cursor:pointer;text-align:center;line-height:1.3;transition:background .15s,color .15s;}
.sc-btn:last-child{border-right:none;}
.sc-btn.active{background:#f9f8f5;color:#111;font-weight:700;}
.sc-btn:hover:not(.active){background:#f9f8f5;}
.tab-bar{display:flex;border-bottom:0.5px solid #ddd;background:#f9f8f5;}
.tab{flex:1;padding:7px 6px;font-family:'Special Elite',cursive;font-size:11px;background:transparent;border:none;border-right:0.5px solid #ddd;color:#888;cursor:pointer;text-align:center;transition:all .15s;}
.tab:last-child{border-right:none;}
.tab.active{background:#fff;color:#111;font-weight:700;border-bottom:2px solid #111;}
.panel{display:none;flex-direction:column;}
.panel.active{display:flex;}
.mode-bar{display:flex;gap:5px;padding:7px 12px;border-bottom:0.5px solid #ddd;background:#f9f8f5;flex-wrap:wrap;}
.chip{font-family:'Special Elite',cursive;font-size:11px;padding:3px 10px;border-radius:999px;border:0.5px solid #bbb;background:#fff;color:#666;cursor:pointer;transition:all .15s;}
.chip.active{background:#111;color:#fff;border-color:#111;}
.chat-area{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:310px;}
.msg{display:flex;gap:8px;}
.msg.user{flex-direction:row-reverse;}
.av{width:26px;height:26px;border-radius:50%;border:0.5px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;font-family:'Special Elite',cursive;background:#f9f8f5;color:#888;}
.bub{max-width:84%;padding:8px 11px;border-radius:4px;font-size:12px;line-height:1.55;color:#222;border:0.5px solid #e8e8e8;background:#fff;font-family:'Courier Prime',monospace;white-space:pre-wrap;}
.msg.user .bub{background:#f9f8f5;border-color:#ddd;}
.src{font-size:10px;color:#aaa;margin-top:3px;font-style:italic;font-family:'IM Fell English',serif;}
.sysmsg{text-align:center;font-size:10px;color:#aaa;font-family:'Special Elite',cursive;padding:3px 0;}
.dots{display:flex;gap:4px;align-items:center;padding:4px 0;}
.dot{width:5px;height:5px;border-radius:50%;background:#aaa;animation:blink 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}
.mood-bar{padding:8px 12px;border-top:0.5px solid #ddd;background:#f9f8f5;}
.mood-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.mood-title{font-size:10px;font-family:'Special Elite',cursive;color:#888;letter-spacing:.05em;text-transform:uppercase;}
.reset-btn{font-family:'Special Elite',cursive;font-size:10px;color:#aaa;background:none;border:none;cursor:pointer;text-decoration:underline;}
.reset-btn:hover{color:#666;}
.mood-grid{display:flex;flex-direction:column;gap:4px;}
.mood-row{display:flex;align-items:baseline;gap:8px;}
.mood-faction{font-family:'Special Elite',cursive;font-size:10px;color:#aaa;width:110px;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;}
.mood-label{font-family:'IM Fell English',serif;font-size:12px;color:#666;line-height:1.3;font-style:italic;transition:color .4s;}
.mood-label.updating{color:#111;}
.inject-bar{padding:7px 12px;border-top:0.5px solid #ddd;background:#f9f8f5;}
.inj-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;font-family:'Special Elite',cursive;}
.inj-row{display:flex;gap:6px;}
select{flex:1;padding:5px 7px;font-family:'Courier Prime',monospace;font-size:12px;background:#fff;border:0.5px solid #bbb;border-radius:8px;color:#222;cursor:pointer;}
.inj-btn{padding:5px 12px;font-family:'Special Elite',cursive;font-size:12px;background:#111;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:opacity .15s;}
.inj-btn:hover{opacity:.8;}
.input-row{display:flex;gap:7px;padding:8px 12px;border-top:0.5px solid #ddd;}
textarea.ci{flex:1;padding:7px 9px;font-family:'Courier Prime',monospace;font-size:12px;background:#fff;border:0.5px solid #bbb;border-radius:8px;color:#222;resize:none;height:36px;}
.send-btn{padding:7px 14px;font-family:'Special Elite',cursive;font-size:12px;background:#111;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.send-btn:hover{opacity:.8;}
.send-btn:disabled{opacity:.4;cursor:not-allowed;}
.speech-panel{padding:12px;display:flex;flex-direction:column;gap:8px;}
.sp-label{font-family:'Special Elite',cursive;font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.1em;}
.sp-fields{display:flex;gap:6px;}
.sp-fields input{flex:1;padding:6px 9px;font-family:'Courier Prime',monospace;font-size:12px;background:#fff;border:0.5px solid #bbb;border-radius:8px;color:#222;}
.transcript-box{width:100%;min-height:76px;padding:8px 10px;font-family:'Courier Prime',monospace;font-size:12px;background:#fff;border:0.5px solid #bbb;border-radius:8px;color:#222;resize:vertical;line-height:1.5;}
.rec-row{display:flex;gap:6px;align-items:center;}
.rec-btn{padding:5px 12px;font-family:'Special Elite',cursive;font-size:12px;border:0.5px solid #bbb;border-radius:8px;cursor:pointer;transition:all .15s;background:#fff;color:#222;white-space:nowrap;}
.rec-btn.recording{background:#fff0f0;color:#c0392b;border-color:#c0392b;}
.rec-status{font-size:11px;font-family:'Special Elite',cursive;color:#aaa;}
.rec-status.live{color:#c0392b;}
.action-row{display:flex;gap:6px;align-items:center;}
.analyze-btn{padding:6px 16px;font-family:'Special Elite',cursive;font-size:12px;background:#111;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:opacity .15s;}
.analyze-btn:hover{opacity:.8;}
.analyze-btn:disabled{opacity:.4;cursor:not-allowed;}
.result-card{background:#f9f8f5;border:0.5px solid #ddd;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;font-family:'Courier Prime',monospace;color:#222;}
.result-section{margin-bottom:8px;}
.result-section:last-child{margin-bottom:0;}
.result-label{font-family:'Special Elite',cursive;font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;}
.archive-header{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:0.5px solid #ddd;background:#f9f8f5;}
.archive-label{font-family:'Special Elite',cursive;font-size:11px;color:#666;}
.archive-list{padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:480px;overflow-y:auto;}
.arch-empty{font-family:'Special Elite',cursive;font-size:12px;color:#aaa;text-align:center;padding:24px 0;}
.arch-card{background:#fff;border:0.5px solid #e8e8e8;border-radius:12px;padding:10px 12px;}
.arch-meta{display:flex;gap:6px;align-items:baseline;margin-bottom:5px;flex-wrap:wrap;}
.arch-speaker{font-family:'Special Elite',cursive;font-size:12px;font-weight:700;color:#111;}
.arch-faction{font-family:'Special Elite',cursive;font-size:10px;color:#666;padding:2px 7px;border:0.5px solid #bbb;border-radius:999px;}
.arch-time{font-size:10px;color:#aaa;margin-left:auto;}
.arch-summary{font-size:12px;color:#666;line-height:1.5;font-family:'Courier Prime',monospace;margin-bottom:4px;}
.arch-press{font-size:11px;color:#aaa;font-style:italic;font-family:'IM Fell English',serif;border-left:2px solid #ddd;padding-left:8px;margin-top:4px;}
.arch-note{font-size:11px;color:#aaa;font-family:'Courier Prime',monospace;margin-top:4px;}
.arch-toggle{font-family:'Special Elite',cursive;font-size:10px;color:#aaa;cursor:pointer;background:none;border:none;padding:3px 0 0;text-decoration:underline;}
.arch-transcript{font-size:11px;color:#aaa;font-family:'Courier Prime',monospace;margin-top:5px;padding:6px 8px;background:#f9f8f5;border-radius:8px;line-height:1.5;}
.save-indicator{font-size:10px;font-family:'Special Elite',cursive;color:#aaa;padding:3px 12px;border-top:0.5px solid #ddd;background:#f9f8f5;text-align:right;min-height:20px;}
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div class="masthead-title">The Historical Correspondent</div>
    <div class="section-bar">
      <button class="sec-btn active" id="sec-btn-A" onclick="setSection('A')"><span class="sec-dot" style="background:#378ADD;"></span>Section A</button>
      <button class="sec-btn" id="sec-btn-B" onclick="setSection('B')"><span class="sec-dot" style="background:#D85A30;"></span>Section B</button>
    </div>
  </div>
  <div class="scenario-bar">
    <button class="sc-btn active" onclick="setSc('july1914')" id="btn-july1914">July Crisis 1914</button>
    <button class="sc-btn" onclick="setSc('japan1941')" id="btn-japan1941">Japan 1941</button>
    <button class="sc-btn" onclick="setSc('yalta1945')" id="btn-yalta1945">Restoring the World 1945</button>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="setTab('correspondent')" id="tab-correspondent">Correspondent</button>
    <button class="tab" onclick="setTab('speech')" id="tab-speech">Speech Tracker</button>
    <button class="tab" onclick="setTab('archive')" id="tab-archive">Archive (<span id="arch-count">0</span>)</button>
  </div>
  <div class="panel active" id="panel-correspondent">
    <div class="mode-bar">
      <div class="chip active" onclick="setMode('press')" id="chip-press">The Press</div>
      <div class="chip" onclick="setMode('vox')" id="chip-vox">Vox Populi</div>
      <div class="chip" onclick="setMode('rumor')" id="chip-rumor">Rumor Mill</div>
      <div class="chip" onclick="setMode('instructor')" id="chip-instructor">Instructor</div>
    </div>
    <div class="chat-area" id="chat-area"></div>
    <div class="mood-bar">
      <div class="mood-header">
        <span class="mood-title">Public mood</span>
        <button class="reset-btn" onclick="resetMoods()">Reset</button>
      </div>
      <div class="mood-grid" id="mood-grid"></div>
    </div>
    <div class="inject-bar" id="inject-bar" style="display:none;">
      <div class="inj-label">Inject a news event</div>
      <div class="inj-row">
        <select id="event-select"></select>
        <button class="inj-btn" onclick="injectEvent()">Dispatch</button>
      </div>
    </div>
    <div class="input-row">
      <textarea class="ci" id="chat-input" placeholder="Ask the correspondent…" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMsg()">Send</button>
    </div>
  </div>
  <div class="panel" id="panel-speech">
    <div class="speech-panel">
      <div class="sp-label" id="speech-section-label">Speaker — Section A</div>
      <div class="sp-fields">
        <input type="text" id="sp-name" placeholder="Speaker name / role" />
        <select id="sp-faction"></select>
      </div>
      <div class="sp-label">Transcript</div>
      <div class="rec-row">
        <button class="rec-btn" id="rec-btn" onclick="toggleRecording()">Mic: Start</button>
        <span class="rec-status" id="rec-status">Ready — or type / paste below</span>
      </div>
      <textarea class="transcript-box" id="transcript-box" placeholder="Transcript appears here during recording, or type / paste a speech…"></textarea>
      <div class="action-row">
        <button class="analyze-btn" id="analyze-btn" onclick="analyzeSpeech()">Analyze Speech</button>
        <button class="rec-btn" onclick="clearSpeech()">Clear</button>
      </div>
      <div id="speech-result"></div>
    </div>
  </div>
  <div class="panel" id="panel-archive">
    <div class="archive-header">
      <span class="archive-label" id="archive-label">Section A — July Crisis 1914</span>
      <span>
        <button class="reset-btn" onclick="exportArchive()">Export JSON</button>
        <button class="reset-btn" onclick="clearArchive()">Clear archive</button>
      </span>
    </div>
    <div class="archive-list" id="archive-list"></div>
  </div>
  <div class="save-indicator" id="save-indicator"></div>
  <div style="text-align:center;padding:6px 12px;background:#f9f8f5;border-top:0.5px solid #ddd;font-family:'Special Elite',cursive;font-size:10px;color:#aaa;letter-spacing:.06em;">&copy; Alastair Kocho-Williams</div>
</div>
<script>
const SC_DATA={july1914:{label:"July Crisis 1914",defaultMoods:[{name:"Austro-Hungarian public",label:"Outraged, demanding punishment of Serbia for the Archduke's murder"},{name:"German public",label:"Confident, rallying behind Austria-Hungary and the alliance"},{name:"Russian public",label:"Agitated — pan-Slavist sentiment rising, watching Serbia closely"},{name:"French public",label:"Tense but distracted — the Caillaux trial dominates the newspapers"},{name:"British public",label:"Largely indifferent — Ireland and Home Rule feel more pressing"},{name:"Serbian public",label:"Defiant but frightened — the ultimatum feels like an act of war"},{name:"Italian public",label:"Divided and cautious — watching which way the wind blows"},{name:"Ottoman public",label:"Wary, calculating — which alliance offers the better opportunity?"}],factionNames:["German Empire","Kingdom of Great Britain and Ireland","Republic of France","Austro-Hungarian Empire","Russian Empire","Kingdom of Italy","Ottoman Empire","Kingdom of Bulgaria","Kingdom of Romania","Kingdom of Greece","Kingdom of Serbia","Journalist (no faction)"],events:["Austria-Hungary delivers ultimatum to Serbia — 48-hour deadline imposed","Serbia rejects key terms — refuses Habsburg officials on Serbian soil","Austria-Hungary declares Serbian reply unsatisfactory and begins mobilisation","Russia orders partial mobilisation in support of Serbia","Germany issues 12-hour ultimatum to Russia demanding it halt mobilisation","German Goeben and Breslau slip through the Mediterranean toward Constantinople","Germany declares war on Russia — Schlieffen Plan set in motion","German troops enter Belgium — Britain issues ultimatum to Berlin","Britain declares war on Germany — the Triple Entente is at war","General strike paralyses St. Petersburg — revolution feared","Jean Jaurès, French socialist leader, assassinated in Paris","Russian Ambassador Hartwig dies suddenly in the Austro-Hungarian Embassy, Belgrade","British Army fires on Dublin crowd at Bachelor's Walk — three killed","Italy declares neutrality — Triple Alliance abandoned"],sources:{press:["Reuters, Vienna","Wolff Bureau, Berlin","Agence Havas, Paris","The Times, London","Neue Freie Presse, Vienna","Le Figaro, Paris","Petersburgskiye Vedomosti","Corriere della Sera, Milan"],vox:["Street report, Vienna","Café gossip, Berlin","Hyde Park Corner, London","Boulevard des Capucines, Paris","Market square, Belgrade","Nevsky Prospekt, St. Petersburg","Piazza Colonna, Rome"],rumor:["Military attaché, source undisclosed","Diplomatic courier, identity withheld","Embassy clerk, background only","Foreign ministry leak, unverified","General Staff source, not for attribution"]},moodCtx:"The July Crisis, late July 1914. The assassination of Archduke Franz Ferdinand in Sarajevo has triggered a confrontation between Austria-Hungary and Serbia drawing the great powers toward war through their alliance commitments. Factions: German Empire (Wilhelm II, Moltke, Bethmann Hollweg), Austro-Hungarian Empire (Berchtold, Conrad von Hötzendorf, Tisza), Russian Empire (Nicholas II, Sazonov, Sukhomlinov), Republic of France (Poincaré, Viviani, Joffre), Kingdom of Great Britain (Asquith, Grey, Lloyd George), Kingdom of Serbia (Pašić), Kingdom of Italy (San Giuliano, Salandra), Ottoman Empire (Enver Pasha, Djemal Pasha), Kingdom of Bulgaria (Ferdinand I), Kingdom of Romania (Carol I, Bratianu), Kingdom of Greece (Constantine I, Venizelos), and five U.S. war correspondents with no faction.",system:`You are The Historical Correspondent for a Reacting to the Past classroom simulation of the July 1914 Crisis. You are NOT a player — you are the atmosphere: the press corps, the voice of the street, the rumor mill of the chancelleries. It is late July 1914. The assassination of Archduke Franz Ferdinand in Sarajevo has triggered a diplomatic confrontation between Austria-Hungary and Serbia that is drawing the great powers toward war through their alliance commitments. THE FACTIONS IN THIS SIMULATION: German Empire (Kaiser Wilhelm II, Chief of Staff Moltke, Chancellor Bethmann Hollweg); Austro-Hungarian Empire (Foreign Minister Berchtold, Chief of Staff Conrad von Hötzendorf, Hungarian PM Tisza); Russian Empire (Tsar Nicholas II, Foreign Minister Sazonov, Minister of War Sukhomlinov); Republic of France (President Poincaré, Premier Viviani, Marshal Joffre); Kingdom of Great Britain and Ireland (PM Asquith, Foreign Secretary Grey, Chancellor of Exchequer Lloyd George); Kingdom of Serbia (PM Nikola Pašić); Kingdom of Italy (Foreign Minister San Giuliano, PM Salandra); Ottoman Empire (War Minister Enver Pasha, Navy Minister Djemal Pasha); Kingdom of Bulgaria (Tsar Ferdinand I); Kingdom of Romania (King Carol I, PM Bratianu); Kingdom of Greece (King Constantine I, PM Venizelos); five U.S. war correspondents with no faction (Richard Harding Davis, Mary Boyle O'Reilly, Will Irwin, Mary Roberts Rinehart, Frederick Palmer). THREE VOICES: (1) THE PRESS: Dispatches in period newspaper voice with real bylines and datelines — Reuters, Wolff Bureau, Agence Havas, The Times, Neue Freie Presse, Le Figaro, Petersburgskiye Vedomosti, Corriere della Sera. Headlines urgent and period-appropriate. Vary register from curt telegram to florid editorial. (2) VOX POPULI: The voice of national publics — Vienna crowds demanding action against Serbia, Berlin cafés confident of quick victory, St. Petersburg workers agitated by pan-Slavist feeling, London readers distracted by Ireland, Paris citizens shaken by Jaurès's murder, Belgrade families frightened by the ultimatum, Rome debating which side to join. Show how ordinary people in each country understand and misunderstand the crisis. (3) RUMOR MILL: Unverified café gossip, intelligence fragments, diplomatic whispers. Mark clearly UNCONFIRMED or RUMOR. Always historically plausible. RULES: Never speak for or as any student role. You exist in the present of the crisis — no retrospective knowledge of how it ends. Responses under 150 words unless a full dispatch is explicitly requested.`},japan1941:{label:"Japan 1941: Between Pan-Asianism and the West",defaultMoods:[{name:"Japanese public",label:"Resolute, rallying behind Pan-Asian mission — confident in Imperial Army"},{name:"American public",label:"Wary but distracted — Europe feels like the real danger"},{name:"British colonial subjects",label:"Stretched thin, anxious — Singapore feels exposed"},{name:"Chinese public (Jiang’s territory)",label:"Exhausted and desperate — counting on American aid to continue"},{name:"Dutch East Indies",label:"Nervous, calculating — watching Japan’s demands with dread"}],factionNames:["Army (Rikugun)","Navy (Kaigun)","Imperial Court","Indeterminate","German Ambassador (Ott)","U.S. Ambassador (Grew)"],events:["Cabinet approves 1941 Materials Mobilization Plan — army/navy fight for priority","Japan signs Tripartite Pact with Germany and Italy","Japanese forces occupy northern French Indochina","Wang Jingwei’s Nanjing regime recognized as China’s legitimate government","Cabinet debates New Economic Order — zaibatsu under fire","Japan demands Dutch East Indies sell 3.75 million tons of oil annually","Japanese forces occupy southern French Indochina","United States freezes Japanese assets and halts oil exports","Army faction votes on war against Soviet Union (North Wind, Cloudy)","Navy presents case for southern advance (West Wind, Clear)","Cabinet Planning Board issues 1942 Materials Mobilization Plan","Cabinet approves preparations for war against Western powers","Imperial Conference — final decision on war or diplomacy"],sources:{press:["Asahi Shimbun, Tokyo","Mainichi Shimbun, Tokyo","Domei News Agency","Yomiuri Shimbun","Associated Press, Tokyo","United Press, Washington"],vox:["Tokyo factory worker","Osaka merchant family","Army wife, Hiroshima","Manila resident, nervous","Singapore civilian, uneasy","American isolationist, Chicago"],rumor:["Imperial Conference corridor, not for attribution","Naval General Staff source, unverified","Army Ministry leak, unconfirmed","Foreign Ministry aide, background only"]},moodCtx:"Japan 1941: Between Pan-Asianism and the West. Prince Konoe Fumimaro’s cabinet faces a fateful crossroads in 1940–41: secure oil and resources through diplomacy or force, resolve the interminable China Incident, and decide whether to align with Nazi Germany and risk war with the United States. ARMY: Army Chief of Staff Sugiyama Hajime; War Minister Tōjō Hideki; Maj. Gen. Muto Akira (Director, Military Affairs Bureau — a bakuryō, ‘officer behind the curtain,’ who quietly runs interference for Tōjō); Lt. Gen. Suzuki Teiichi; Lt. Gen. Tsukada Osamu (well-connected to ultranationalist secret societies). NAVY: Chief of Staff Prince Fushimi Hiroyasu (an imperial prince and elder statesman of the militant Fleet bloc, expected to retire in favor of Nagano Osami); Navy Minister Oikawa Koshirō; Vice Minister Toyoda Teijirō (Treaty-bloc moderate, quietly opposed to the Tripartite Pact); Rear Adm. Oka Takasumi (Director, Bureau of Naval Affairs — the navy’s own bakuryō); Vice Adm. Itō Seiichi (Director, Bureau of Personnel, shaped by his years in America into a skeptic of war with the U.S.); Vice Adm. Kondō Nobutake (Vice Chief of Staff). The Navy publicly defers to Pan-Asian policy but privately dreads war with the United States — the honne/tatemae divide that runs through the whole faction. IMPERIAL COURT: Prince Konoe Fumimaro (Prime Minister, a political chameleon who avoids taking firm positions); Marquis Kido Kōichi (Lord Keeper of the Privy Seal, the emperor’s closest adviser); Baron Hiranuma Kiichirō (Home Minister, a fanatical anti-communist who controls press censorship); Hara Yoshimichi (Privy Council President); Prince Fushimi Hiroyasu (dual-hatted with the Navy). INDETERMINATES: Matsuoka Yōsuke (President, South Manchuria Railway — gregarious, American-educated, an aggressive Pan-Asianist) and Tōgō Shigenori (veteran diplomat of Korean ancestry, cautious and pro-trade) are rival contenders for Foreign Minister; Ogura Masatsune (Finance Minister, ex-Sumitomo, opposed to any New Economic Order); Ogata Taketora (editor, Asahi Shimbun, secretly tied to ultranationalist circles); Ozaki Hotsumi (journalist and trusted Konoe adviser); Sakonji Seizō (North Sakhalin Oil Company, an outsider seeking a cabinet seat); Tanabe Harumichi (House of Peers, protégé of Hiranuma); Hoshino Naoki, Kaya Okinori, Kishi Nobusuke, Kobayashi Ichizō (reform bureaucrats with ties to Manchukuo); German Ambassador Eugen Ott; U.S. Ambassador Joseph Grew.",system:`You are The Historical Correspondent for a Reacting to the Past classroom simulation of Japan 1941: Between Pan-Asianism and the West. You are NOT a player — you are the atmosphere: Japanese press dispatches, the voices of publics across the Pacific world, and the rumor mill of Imperial Tokyo. The simulation is set in 1940–41. Prince Konoe Fumimaro is Prime Minister, presiding over a cabinet debating whether to secure oil from the Dutch East Indies, occupy Indochina, ally with Germany, and ultimately whether to go to war with Britain, the United States, or the Soviet Union. THE FACTIONS IN THIS SIMULATION: ARMY (faction leader: General Sugiyama Hajime, Army Chief of Staff; also General Tōjō Hideki, War Minister; Maj. Gen. Muto Akira, Director of the Military Affairs Bureau and one of the army’s bakuryō — officers of great behind-the-scenes influence, close to Tōjō; Lt. Gen. Suzuki Teiichi; Lt. Gen. Tsukada Osamu, well connected to ultranationalist secret societies). NAVY (faction leader: Prince Fushimi Hiroyasu, Navy Chief of Staff, an imperial prince and elder of the militant Fleet bloc, expected to step down in favor of Nagano Osami; also Admiral Oikawa Koshirō, Navy Minister; Vice Admiral Toyoda Teijirō, Vice Navy Minister and a Treaty-bloc moderate quietly opposed to the German alliance; Rear Admiral Oka Takasumi, Director of the Bureau of Naval Affairs and the navy’s own bakuryō; Vice Admiral Itō Seiichi, Director of the Bureau of Personnel, shaped by years in America into a skeptic of war with the U.S.; Vice Admiral Kondō Nobutake, Vice Chief of Staff). The Navy publicly defers to Pan-Asian policy but privately dreads war with the United States — the honne/tatemae dynamic that defines the faction. IMPERIAL COURT (Prince Konoe Fumimaro, Prime Minister — a political chameleon who avoids showing his hand; Marquis Kido Kōichi, Lord Keeper of the Privy Seal and the emperor’s closest adviser, tasked with insulating the throne from any controversial decision; Baron Hiranuma Kiichirō, Home Minister, a fanatical anti-communist who controls press censorship; Hara Yoshimichi, Privy Council President; Prince Fushimi Hiroyasu, who also sits with the Navy). INDETERMINATES with no fixed faction: Matsuoka Yōsuke, President of the South Manchuria Railway — gregarious, American-educated, and an aggressive advocate of the Tripartite Pact and a hard line toward Washington; Tōgō Shigenori, a veteran diplomat of Korean ancestry, reserved and skeptical of Germany, Matsuoka’s rival for the Foreign Ministry; Ogura Masatsune, Finance Minister, a former Sumitomo executive opposed to any New Economic Order; Ogata Taketora, editor of the Asahi Shimbun; Ozaki Hotsumi, journalist and one of Konoe’s trusted advisers; Sakonji Seizō, President of the North Sakhalin Oil Company, an outsider maneuvering for a cabinet post; Tanabe Harumichi, member of the House of Peers and protégé of Hiranuma; Hoshino Naoki (Cabinet Planning Board); Kaya Okinori (North China Development Company); Kishi Nobusuke (Vice Minister of Commerce and Industry); Kobayashi Ichirō (Minister of Commerce and Industry); Ambassador Eugen Ott (German Embassy); Ambassador Joseph Grew (U.S. Embassy). THREE VOICES: (1) THE PRESS/RADIO: Japanese newspaper dispatches (Asahi Shimbun, Mainichi, Domei news agency) written in the martial-patriotic register of wartime Japanese journalism, subject to Home Ministry censorship. American wire copy (AP, UP) from Tokyo correspondents — measured, increasingly alarmed. Show the profound asymmetry between how events are framed in Tokyo versus Washington. (2) VOX POPULI: Japanese factory workers and families rallying behind the Pan-Asian mission; American isolationists on the radio; anxious British colonial civilians in Singapore and Malaya; Chinese civilians in Jiang Jieshi’s territory counting on American aid; Dutch East Indies residents watching Japanese pressure with dread. (3) RUMOR MILL: What leaks from the Imperial Conference chambers? Which faction is winning the resource fight? What does the Navy really think about war? What is Ambassador Grew reporting to Washington? Mark UNCONFIRMED. RULES: Never speak for or as any student role. Exist in the present — Pearl Harbor is future and uncertain. The Navy’s true reluctance about war is its deepest secret — honne versus tatemae. Never reveal or confirm any character’s private motives, hidden loyalties, or secret objectives (for example, whether any adviser has outside intelligence connections, or which officials profit from illicit trade) — atmosphere and rumor may gesture at unease or suspicion but must never confirm what only the Gamemaster and the player in question know. Responses under 150 words unless a full dispatch is explicitly requested.`},yalta1945:{label:"Restoring the World: Yalta 1945",defaultMoods:[{"name": "American public", "label": "Cautiously hopeful — wants the war won and boys home"}, {"name": "British public", "label": "War-weary, trusting Churchill, anxious about the empire"}, {"name": "Soviet public", "label": "Proud, grieving — twenty million dead demand security"}, {"name": "Polish opinion (London and Warsaw)", "label": "Deeply divided and alarmed — fears Soviet domination"}, {"name": "Liberated Europe", "label": "Hopeful but fragile — watching the great powers decide their fate"}, {"name": "Greek public", "label": "Tense — British troops in Athens against Communist guerrillas"}],factionNames:["United States", "Great Britain", "Soviet Union"],events:["Issue 1 — Soviet territorial claims: Baltic States, Bessarabia, and other contested frontiers (Turkey, Iran, Norway) debated", "Issue 2 — Poland: Curzon Line border and the rival Lublin/London Polish governments contested", "Issue 3a — Germany's postwar territory and western/eastern borders debated", "Issue 3b — German reparations: cash, goods, or forced labor debated", "Issue 3c — Zones of occupation for Germany, and France's claim to a zone, debated", "Issue 4 — The Balkans: access for Western personnel to Soviet-occupied Romania, Bulgaria, Yugoslavia", "Issue 5 — Greece: British troops in Athens against Communist guerrillas; elections demanded", "Issue 6 — Declaration on Liberated Europe drafted and presented to the plenary", "Issue 7a — United Nations General Assembly membership: Latin American republics, Soviet republics, British dominions", "Issue 7b — United Nations Security Council: permanent seats, veto power, and China/France's status", "Issue 8 — Japan: Soviet entry into the Pacific War and the price of Soviet cooperation (Port Arthur, Manchuria)", "Issue 9 — Detainees: Soviet citizens in Western custody, Allied airmen in Soviet custody", "Issue 10 — War crimes: trials for Nazi officials and the scope of punitive measures", "Issue 11 — Berlin: whether the city falls to the Red Army alone or to joint Allied action", "Final Protocol signed — communiqué released to the press"],sources:{"press": ["Associated Press, Yalta", "Reuters, London", "TASS, Moscow", "The New York Times, Crimea bureau", "Domei-monitored wire, Tokyo"], "vox": ["London street report", "Moscow factory worker", "Warsaw exile community, London", "American Gold Star mother", "Athens resident, uneasy"], "rumor": ["Delegation aide, not for attribution", "Signals intelligence fragment", "Diplomatic courier, withheld", "Livadia Palace corridor, unconfirmed"]},moodCtx:"The Yalta Conference, February 4–11, 1945, at the Livadia Palace in the Crimea. The Big Three meet to settle the shape of the postwar world across eleven contested issues: Soviet territorial claims and strategic frontiers; Poland's government and borders; Germany's territory, reparations, and occupation zones; the Balkans and Greece; a Declaration on Liberated Europe; the United Nations' General Assembly and Security Council; Soviet entry into the war against Japan; detainees; war crimes; and the fate of Berlin. UNITED STATES delegation: President Franklin Delano Roosevelt (visibly frail, focused on securing Soviet cooperation against Japan and a durable United Nations); Secretary of State Edward R. Stettinius, Jr.; Ambassador to the USSR William Averell Harriman; Fleet Admiral William D. Leahy (Chief of Staff to the Commander in Chief); Lend-Lease Administrator Harry Hopkins; James F. Byrnes (Director, Office of War Mobilization and Reconversion, drafting the Declaration on Liberated Europe); General George Marshall; Admiral Ernest J. King; interpreter Charles \"Chip\" Bohlen. GREAT BRITAIN delegation: Prime Minister Winston Spencer Churchill (determined to preserve British power and restore France to major-power status); Foreign Secretary Robert Anthony Eden; Sir Alexander Cadogan (Permanent Under-Secretary for Foreign Affairs); Admiral Sir Andrew Cunningham (First Sea Lord); Air Chief Marshal Charles Portal; Field Marshal Alan Brooke (Imperial Chief of Staff); Ambassador to the USSR Archibald Clark Kerr; Field Marshal Harold Alexander (Supreme Commander, Mediterranean). SOVIET UNION delegation: Premier Joseph Vissarionovich Stalin (seeking secure strategic frontiers above all); Foreign Commissar Viacheslav Molotov; Deputy Foreign Commissar Ivan Maisky; General Aleksei Antonov (First Deputy Chief, Red Army General Staff); NKVD Director Lavrenty Beria (secretly screening the Soviet delegation itself for security risks); Deputy Foreign Commissar Andrei Vyshinsky; Air Marshal Sergei Khudyakov; Ambassador to the US Andrei Gromyko; Admiral of the Fleet Nikolai Kuznetsov; Ambassador to Great Britain Fedor Gusev. Public mood reflects American cautious optimism, British war-weariness and imperial anxiety, Soviet grief and hard-won determination, Polish despair split between the London and Lublin camps, and the fragile hope of liberated Europe.",system:`You are The Historical Correspondent for a Reacting to the Past simulation of the Yalta Conference, February 1945 — “Restoring the World.” You are NOT a player — you are the atmosphere: wartime press corps, the voices of exhausted peoples, and the rumor mill of the Crimean conference halls. It is February 4–11, 1945, at the Livadia Palace. THE THREE DELEGATIONS IN THIS SIMULATION: UNITED STATES (President Franklin Delano Roosevelt, visibly weakened by illness but focused on a durable United Nations and Soviet entry against Japan; Secretary of State Edward Stettinius; Ambassador Averell Harriman; Fleet Admiral William Leahy; Harry Hopkins; James F. Byrnes, drafting the Declaration on Liberated Europe; General George Marshall; Admiral Ernest King; interpreter Chip Bohlen). GREAT BRITAIN (Prime Minister Winston Churchill, defending British power, empire, and France's restoration to major-power status; Foreign Secretary Anthony Eden; Sir Alexander Cadogan; Admiral Sir Andrew Cunningham; Air Chief Marshal Charles Portal; Field Marshal Alan Brooke; Ambassador Archibald Clark Kerr; Field Marshal Harold Alexander). SOVIET UNION (Premier Joseph Stalin, focused above all on secure strategic frontiers; Foreign Commissar Viacheslav Molotov; Deputy Commissar Ivan Maisky; General Aleksei Antonov; NKVD Director Lavrenty Beria; Deputy Commissar Andrei Vyshinsky; Air Marshal Sergei Khudyakov; Ambassador Andrei Gromyko; Admiral Nikolai Kuznetsov; Ambassador Fedor Gusev). THE ISSUES BEFORE THE CONFERENCE: Soviet territorial claims (the Baltic states, Bessarabia, and contested areas of Turkey, Iran, and Norway); Poland's government (the rival London and Lublin Poles) and its eastern border (the Curzon Line question); Germany's territory, reparations, and occupation zones (including France's claim to a zone); the Balkans and access for Western observers to Soviet-occupied Romania, Bulgaria, and Yugoslavia; Greece, where British troops back the government against Communist guerrillas; a Declaration on Liberated Europe; the shape of the United Nations (General Assembly membership and Security Council veto power); Soviet entry into the war against Japan and its price; the fate of detainees held by each side; the scope of war-crimes trials; and who takes Berlin. THREE VOICES: (1) THE PRESS: AP, Reuters, and TASS house styles, all operating under wartime censorship — what each service can print differs sharply by capital. (2) VOX POPULI: British civilians exhausted after nearly six years of war; American families desperate for the boys to come home and the Pacific war to end; Soviet citizens who lost twenty million dead and want security, not sympathy; Poles and other liberated Europeans terrified about their fate under the shifting map; Greeks caught between British bayonets and Communist guerrillas. (3) RUMOR MILL: leaks from the Livadia Palace corridors — Roosevelt's health, secret protocols, disputes between the delegations — mark clearly UNCONFIRMED. RULES: Never speak for or as any student role. Exist in the present of the conference — the outcomes of these eleven issues are not yet decided, and you have no retrospective knowledge of the Cold War to come. Never reveal or confirm any character's private motives, hidden loyalties, or secret objectives (for example, NKVD security assessments of the Soviet delegation, or any delegate's personal wagers against their official brief) — atmosphere and rumor may gesture at unease or tension but must never confirm what only the Gamemaster and the player in question know. Responses under 150 words unless a full dispatch is explicitly requested.`}};

const storage={async get(k){try{const r=await fetch('/api/storage/'+encodeURIComponent(k));if(r.status===404)return null;if(!r.ok)return null;const data=await r.json();return{value:data.value};}catch(e){console.error('Storage get failed:',e);return null;}},async set(k,v){try{const r=await fetch('/api/storage/'+encodeURIComponent(k),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:v})});if(!r.ok)throw new Error('HTTP '+r.status);}catch(e){console.error('Storage set failed:',e);throw e;}},async delete(k){try{await fetch('/api/storage/'+encodeURIComponent(k),{method:'DELETE'});}catch(e){console.error('Storage delete failed:',e);}}};
function storageKey(t){return`rttp:${curSection}:${curSc}:${t}`;}

function showSaved(){const el=document.getElementById('save-indicator');el.textContent='Saved · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});clearTimeout(el._t);el._t=setTimeout(()=>{el.textContent='';},2500);}

async function loadState(){const saved=await load(storageKey('moods'));SC_DATA[curSc]._moods=saved||SC_DATA[curSc].defaultMoods.map(m=>({...m}));renderMoods();}

async function updateMoodsFromClaude(trigger){const sc=SC_DATA[curSc];const moodList=getMoods().map(m=>`${m.name}: ${m.label}`).join('\n');const prompt=`You are updating qualitative public mood labels for a Reacting to the Past simulation.\n\nScenario: ${sc.label}\nContext: ${sc.moodCtx}\n\nCurrent moods:\n${moodList}\n\nTriggering event: "${trigger}"\n\nUpdate only moods that would plausibly shift. Labels must be concise (under 12 words), historically grounded, present tense.\n\nRespond ONLY with a JSON array, no other text:\n[{"name":"Faction name exactly as listed","label":"updated mood label"},...]`;try{const r=await callClaude('You update historical public mood labels. Respond only with a JSON array, no markdown, no explanation.',[{role:'user',content:prompt}],400);const updates=JSON.parse(r.replace(/```json|```/g,'').trim());updates.forEach(u=>{if(u.name&&u.label)setMoodLabel(u.name,u.label);});await saveMoods();}catch(e){}}

function addMsg(text,role,source){const area=document.getElementById('chat-area');const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'assistant');const av=document.createElement('div');av.className='av';av.textContent=role==='user'?'YOU':'NWS';const b=document.createElement('div');b.className='bub';b.textContent=text;if(source&&role!=='user'){const s=document.createElement('div');s.className='src';s.textContent=source;b.appendChild(document.createElement('br'));b.appendChild(s);}d.appendChild(av);d.appendChild(b);area.appendChild(d);area.scrollTop=area.scrollHeight;}

function getModeInst(){return{press:'Respond ONLY as The Press. Write a newspaper dispatch, headline, or bulletin — dramatic and period-appropriate.',vox:'Respond ONLY as Vox Populi. Speak as the voice of the people — show national differences where relevant.',rumor:'Respond ONLY as the Rumor Mill. Deliver unverified atmospheric intelligence. Begin with UNCONFIRMED: or RUMOR:.',instructor:'You may answer questions about the simulation and historical context directly and accurately.'}[curMode]||'';}
function getSource(){const pool=SC_DATA[curSc].sources[curMode==='instructor'?'press':curMode]||['Correspondent'];return pool[Math.floor(Math.random()*pool.length)];}
async function callClaude(sys,msgs,max=900){const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:max,system:sys,messages:msgs})});const d=await r.json();return d.content?.[0]?.text||'No response.';}
async function sendMsg(){if(isTyping)return;const inp=document.getElementById('chat-input');const text=inp.value.trim();if(!text)return;inp.value='';addMsg(text,'user');chatHistory.push({role:'user',content:text});isTyping=true;document.getElementById('send-btn').disabled=true;showTyping();try{const reply=await callClaude(SC_DATA[curSc].system+'\n\nCURRENT MODE: '+getModeInst(),chatHistory.slice(-12));removeTyping();addMsg(reply,'assistant',getSource());chatHistory.push({role:'assistant',content:reply});if(/war|mobilise|ultimatum|attack|declare|offensive|surrender|peace|negotiate|concession|agreement|withdraw/i.test(text+reply)){updateMoodsFromClaude(text+' — '+reply.substring(0,200));}}catch(e){removeTyping();addMsg('TRANSMISSION INTERRUPTED.','assistant');}isTyping=false;document.getElementById('send-btn').disabled=false;}
async function injectEvent(){const ev=document.getElementById('event-select').value;if(!ev)return;sysMsg('EVENT: '+ev);const prompt=`Instructor injected this breaking news: "${ev}". Respond with: (1) an urgent Press bulletin, (2) Vox Populi reaction for at least two different national publics, (3) one brief UNCONFIRMED rumor. Under 200 words total.`;chatHistory.push({role:'user',content:prompt});isTyping=true;document.getElementById('send-btn').disabled=true;showTyping();try{const reply=await callClaude(SC_DATA[curSc].system,chatHistory.slice(-10));removeTyping();addMsg(reply,'assistant','BREAKING — '+SC_DATA[curSc].label);chatHistory.push({role:'assistant',content:reply});updateMoodsFromClaude(ev);}catch(e){removeTyping();addMsg('TRANSMISSION INTERRUPTED.','assistant');}isTyping=false;document.getElementById('send-btn').disabled=false;}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function toggleRecording(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){document.getElementById('rec-status').textContent='Voice not supported here — type or paste instead.';return;}if(isRecording){stopRecording();return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-US';recognition.onstart=()=>{isRecording=true;document.getElementById('rec-btn').textContent='Mic: Stop';document.getElementById('rec-btn').classList.add('recording');document.getElementById('rec-status').textContent='Recording…';document.getElementById('rec-status').classList.add('live');};recognition.onresult=(e)=>{let interim='',final='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript;}recTranscript+=final;document.getElementById('transcript-box').value=recTranscript+interim;};recognition.onerror=()=>stopRecording();recognition.onend=()=>{if(isRecording)stopRecording();};recognition.start();}

function clearSpeech(){recTranscript='';document.getElementById('transcript-box').value='';document.getElementById('speech-result').innerHTML='';document.getElementById('rec-status').textContent='Ready — or type / paste below';document.getElementById('rec-status').classList.remove('live');}
async function analyzeSpeech(){const transcript=document.getElementById('transcript-box').value.trim();const speaker=document.getElementById('sp-name').value.trim()||'Unknown speaker';const faction=document.getElementById('sp-faction').value||'Unknown faction';if(!transcript){document.getElementById('rec-status').textContent='Please record or enter a speech first.';return;}const btn=document.getElementById('analyze-btn');btn.disabled=true;btn.textContent='Analyzing…';document.getElementById('speech-result').innerHTML='<div class="result-card" style="color:#aaa;">Processing…</div>';const sc=SC_DATA[curSc];const prompt=`You are analyzing a student speech in a Reacting to the Past simulation: ${sc.label}.\nSpeaker: ${speaker} | Faction: ${faction}\n\nSPEECH:\n"${transcript}"\n\nRespond in EXACTLY this format:\n\nSUMMARY:\n[2–3 sentences summarizing the core argument in neutral historical language]\n\nPRESS DISPATCH:\n[3–4 sentence newspaper dispatch in period voice with dateline, vivid and period-appropriate for ${sc.label}]\n\nFACTION REACTIONS:\n[3–4 most relevant factions, one sentence each: "Faction name: reaction." Indicate supportive, hostile, or mixed.]\n\nHISTORICAL NOTES:\n[1–2 constructive sentences on strengths, anachronisms, or missed historical opportunities]`;try{const result=await callClaude('You are an expert historian and educational facilitator for Reacting to the Past simulations. Analyze student speeches with historical rigor and pedagogical care.',[{role:'user',content:prompt}],1200);const secs={};['SUMMARY','PRESS DISPATCH','FACTION REACTIONS','HISTORICAL NOTES'].forEach(s=>{const m=result.match(new RegExp(s+':\\s*([\\s\\S]*?)(?=(?:SUMMARY:|PRESS DISPATCH:|FACTION REACTIONS:|HISTORICAL NOTES:|$))'));if(m)secs[s]=m[1].trim();});document.getElementById('speech-result').innerHTML=`<div class="result-card"><div class="result-section"><div class="result-label">Summary</div>${secs['SUMMARY']||''}</div><div class="result-section"><div class="result-label">Press dispatch</div><em style="font-family:'IM Fell English',serif;font-size:12px;">${secs['PRESS DISPATCH']||''}</em></div><div class="result-section"><div class="result-label">Faction reactions</div>${secs['FACTION REACTIONS']||''}</div><div class="result-section"><div class="result-label">Historical notes</div>${secs['HISTORICAL NOTES']||''}</div></div>`;await updateMoodsFromClaude(`Speech by ${speaker} (${faction}): ${transcript.substring(0,300)}`);const entry={id:Date.now(),speaker,faction,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),date:new Date().toLocaleDateString([],{month:'short',day:'numeric'}),summary:secs['SUMMARY']||'',press:secs['PRESS DISPATCH']||'',factionReactions:secs['FACTION REACTIONS']||'',historicalNotes:secs['HISTORICAL NOTES']||'',transcript,scenario:sc.label};const existing=await load(archiveKey())||[];existing.unshift(entry);await save(archiveKey(),existing);await updateArchiveDisplay();if(secs['PRESS DISPATCH']){chatHistory.push({role:'user',content:`[SPEECH ALERT] ${speaker} (${faction}) just delivered a speech. Press dispatch: ${secs['PRESS DISPATCH']}`});chatHistory.push({role:'assistant',content:secs['PRESS DISPATCH']});}}catch(e){document.getElementById('speech-result').innerHTML='<div class="result-card">Analysis failed — please try again.</div>';}btn.disabled=false;btn.textContent='Analyze Speech';}
async function updateArchiveDisplay(){const archive=await load(archiveKey())||[];document.getElementById('arch-count').textContent=archive.length;const list=document.getElementById('archive-list');if(archive.length===0){list.innerHTML='<div class="arch-empty">No speeches recorded yet for this section and scenario.</div>';return;}list.innerHTML=archive.map(e=>`<div class="arch-card"><div class="arch-meta"><span class="arch-speaker">${e.speaker}</span><span class="arch-faction">${e.faction}</span><span class="arch-time">${e.date||''} ${e.time}</span></div><div class="arch-summary">${e.summary}</div><div class="arch-press">${e.press}</div>${e.historicalNotes?`<div class="arch-note">Note: ${e.historicalNotes}</div>`:''}<button class="arch-toggle" onclick="toggleTranscript(${e.id})">Show transcript</button><div id="tr-${e.id}" class="arch-transcript" style="display:none;">${e.transcript}</div></div>`).join('');}
function toggleTranscript(id){const el=document.getElementById('tr-'+id);if(!el)return;const btn=el.previousElementSibling;if(el.style.display==='none'){el.style.display='block';btn.textContent='Hide transcript';}else{el.style.display='none';btn.textContent='Show transcript';}}
async function clearArchive(){if(!confirm('Clear the entire archive for Section '+curSection+' — '+SC_DATA[curSc].label+'? This cannot be undone.'))return;await del(archiveKey());await updateArchiveDisplay();}
async function exportArchive(){const archive=await load(archiveKey())||[];if(archive.length===0){alert('No speeches recorded yet for this section and scenario.');return;}const payload={section:curSection,scenario:SC_DATA[curSc].label,exportedAt:new Date().toISOString(),entries:archive};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`rttp-archive-section${curSection}-${curSc}-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);}
async function init(){await setSc('july1914');setMode('press');setTab('correspondent');}
init();
</script>
